openapi: 3.0.0
info:
  version: 1.0.0
  title: Email
servers:
  - url: https://api.aurorasendcloud.com
    description: Production server
  - url: https://api.sendcloud.net
    description: Alternative production server
tags:
  - name: Complaint
    description: Spam complaint management operations
paths:
  /api/spamreported/list:
    get:
      summary: Query Spam Reported List (GET)
      description: >-
        Query spam-reported email list within a specified time range using GET
        method. The maximum query time range is 90 days. Supports filtering by
        recipient email, sending domain, email label, and mail server. Returns
        paginated results with detailed spam report information including email
        ID, recipient, sender, subject, send time, report time, mail server,
        domain, and label.
      operationId: getSpamReportedListGet
      tags:
        - Complaint
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: >-
                      Response status code (200 = success; other codes indicate
                      failure)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Success or failure message (detailed error information for
                      failure scenarios)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request succeeded (true = success, false =
                      failure)
                    example: true
                  info:
                    type: object
                    properties:
                      dataList:
                        type: array
                        description: List of spam-reported email details
                        items:
                          type: object
                          properties:
                            emailId:
                              type: string
                              description: Unique email ID
                              example: 20231023123456_7890_abc123@example.com
                            email:
                              type: string
                              description: Recipient email address
                              example: user@example.com
                            from:
                              type: string
                              description: Sender email address
                              example: sender@example.com
                            subject:
                              type: string
                              description: Email subject line
                              example: Special Offer - Limited Time
                            sendTime:
                              type: string
                              format: date-time
                              description: >-
                                Email send time (Beijing time, yyyy-MM-dd
                                HH:mm:ss)
                              example: '2025-10-23 14:30:00'
                            reportTime:
                              type: string
                              format: date-time
                              description: >-
                                Spam report time (Beijing time, yyyy-MM-dd
                                HH:mm:ss)
                              example: '2025-10-23 15:45:00'
                            mailServer:
                              type: string
                              description: Recipient's mail server
                              example: Gmail
                            domain:
                              type: string
                              description: Sending domain
                              example: example.com
                            labelName:
                              type: string
                              description: Email label (as set when sending)
                              example: Promotion
                        example:
                          - emailId: 20231023123456_7890_abc123@example.com
                            email: user@example.com
                            from: sender@example.com
                            subject: Special Offer - Limited Time
                            sendTime: '2025-10-23 14:30:00'
                            reportTime: '2025-10-23 15:45:00'
                            mailServer: Gmail
                            domain: example.com
                            labelName: Promotion
        '400':
          description: >-
            Bad request (e.g., invalid time range, missing required parameters,
            pageSize exceeding 500)
        '401':
          description: Authentication failed (invalid apiUser or apiKey)
      parameters:
        - in: query
          name: startTime
          schema:
            type: string
            format: date-time
          required: true
          description: >-
            Query start time (format: yyyy-MM-dd HH:mm:ss, Beijing time; max 90
            days range)
          example: '2025-10-01 00:00:00'
        - in: query
          name: endTime
          schema:
            type: string
            format: date-time
          required: true
          description: >-
            Query end time (format: yyyy-MM-dd HH:mm:ss, Beijing time; must be
            after startTime)
          example: '2025-10-31 23:59:59'
        - in: query
          name: email
          schema:
            type: string
          required: false
          description: Filter by recipient email address (exact match)
          example: spam@example.com
        - in: query
          name: domain
          schema:
            type: string
          required: false
          description: Filter by sending domain (exact match)
          example: example.com
        - in: query
          name: labelName
          schema:
            type: string
          required: false
          description: Filter by email label (exact match with the label set when sending)
          example: Promotion
        - in: query
          name: mailServer
          schema:
            type: string
          required: false
          description: Filter by recipient's mail server (exact match)
          example: Outlook
        - in: query
          name: page
          schema:
            type: string
            default: 1
          required: false
          description: Page number (starts from 1, defaults to 1)
          example: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 100
            maximum: 500
          required: false
          description: Number of results per page (max 500, default 100)
          example: 50
      security:
        - apiUser: []
          apiKey: []
    post:
      summary: Query Spam Reported List (POST)
      description: >-
        Query spam-reported email list within a specified time range using POST
        method. The maximum query time range is 90 days. Supports filtering by
        recipient email, sending domain, email label, and mail server. Returns
        paginated results with detailed spam report information including email
        ID, recipient, sender, subject, send time, report time, mail server,
        domain, and label.
      operationId: getSpamReportedListPost
      tags:
        - Complaint
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: >-
                      Response status code (200 = success; other codes indicate
                      failure)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Success or failure message (detailed error information for
                      failure scenarios)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request succeeded (true = success, false =
                      failure)
                    example: true
                  info:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: >-
                          Total number of spam-reported emails matching the
                          query conditions
                        example: 25
                      byMailServer:
                        type: object
                        description: >-
                          Spam count grouped by recipient's mail server (key =
                          mail server name, value = number of reports)
                        example:
                          Gmail: 15
                          Outlook: 8
                          Yahoo: 2
                      byDomain:
                        type: object
                        description: >-
                          Spam count grouped by sending domain (key = sending
                          domain, value = number of reports)
                        example:
                          example.com: 20
                          sub.example.com: 5
                      data:
                        type: array
                        description: List of spam-reported email details
                        items:
                          type: object
                          properties:
                            emailId:
                              type: string
                              description: Unique email ID
                              example: 20231023123456_7890_abc123@example.com
                            email:
                              type: string
                              description: Recipient email address
                              example: user@example.com
                            from:
                              type: string
                              description: Sender email address
                              example: sender@example.com
                            subject:
                              type: string
                              description: Email subject line
                              example: Special Offer - Limited Time
                            sendTime:
                              type: string
                              format: date-time
                              description: >-
                                Email send time (Beijing time, yyyy-MM-dd
                                HH:mm:ss)
                              example: '2025-10-23 14:30:00'
                            reportTime:
                              type: string
                              format: date-time
                              description: >-
                                Spam report time (Beijing time, yyyy-MM-dd
                                HH:mm:ss)
                              example: '2025-10-23 15:45:00'
                            mailServer:
                              type: string
                              description: Recipient's mail server
                              example: Gmail
                            domain:
                              type: string
                              description: Sending domain
                              example: example.com
                            labelName:
                              type: string
                              description: Email label (as set when sending)
                              example: Promotion
                        example:
                          - emailId: 20231023123456_7890_abc123@example.com
                            email: user@example.com
                            from: sender@example.com
                            subject: Special Offer - Limited Time
                            sendTime: '2025-10-23 14:30:00'
                            reportTime: '2025-10-23 15:45:00'
                            mailServer: Gmail
                            domain: example.com
                            labelName: Promotion
        '400':
          description: >-
            Bad request (e.g., invalid time range, missing required parameters,
            pageSize exceeding 500)
        '401':
          description: Authentication failed (invalid apiUser or apiKey)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                startTime:
                  type: string
                  format: date-time
                  description: >-
                    Query start time (format: yyyy-MM-dd HH:mm:ss, Beijing time;
                    max 90 days range)
                  example: '2025-10-01 00:00:00'
                endTime:
                  type: string
                  format: date-time
                  description: >-
                    Query end time (format: yyyy-MM-dd HH:mm:ss, Beijing time;
                    must be after startTime)
                  example: '2025-10-31 23:59:59'
                email:
                  type: string
                  description: Filter by recipient email address (exact match)
                  example: spam@example.com
                domain:
                  type: string
                  description: Filter by sending domain (exact match)
                  example: example.com
                labelName:
                  type: string
                  description: >-
                    Filter by email label (exact match with the label set when
                    sending)
                  example: Promotion
                mailServer:
                  type: string
                  description: Filter by recipient's mail server (exact match)
                  example: Outlook
                page:
                  type: integer
                  default: 1
                  description: Page number (starts from 1, defaults to 1)
                  example: 1
                pageSize:
                  type: integer
                  default: 100
                  maximum: 500
                  description: Number of results per page (max 500, default 100)
                  example: 50
              required:
                - startTime
                - endTime
      security:
        - apiUser: []
          apiKey: []
  /api/spamreported/export:
    post:
      summary: Export Spam Reported List
      description: >-
        Export spam-reported email data within a specified time range to a CSV
        file. The maximum export time range is 30 days, and the generated CSV
        file is valid for 24 hours (after which the download URL expires). The
        CSV includes fields: emailId, email, from, subject, sendTime,
        reportTime, mailServer, domain, labelName.
      operationId: exportSpamReportedList
      tags:
        - Complaint
      responses:
        '200':
          description: Export task created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 = task created successfully)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Task creation result message (error information if
                      creation fails, such as "time range exceeds 30 days")
                    example: export task created successfully
                  result:
                    type: boolean
                    description: >-
                      Whether the task was created successfully (true = success,
                      false = failure)
                    example: true
                  info:
                    type: object
                    properties:
                      taskId:
                        type: string
                        description: >-
                          Export task ID (used to query task status or
                          troubleshoot issues with technical support)
                        example: export_spam_123456
                      downloadUrl:
                        type: string
                        description: >-
                          CSV download URL (empty when the task is processing;
                          valid for 24 hours after task completion; expired URLs
                          cannot be reused)
                        example: https://download.sendcloud.net/spam_export_123.csv
                      status:
                        type: string
                        enum:
                          - processing
                          - completed
                          - failed
                        description: >-
                          Export task status (processing = being generated;
                          completed = generated successfully; failed =
                          generation failed due to data volume or parameter
                          issues)
                        example: processing
                      estimatedTime:
                        type: integer
                        description: >-
                          Estimated completion time (seconds; for reference
                          only, subject to data volume; larger data volumes take
                          longer)
                        example: 45
        '400':
          description: >-
            Bad request (e.g., time range exceeds 30 days, endTime earlier than
            startTime, duplicate export tasks for the same conditions within 5
            minutes)
        '401':
          description: Authentication failed (invalid apiUser or apiKey)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                startTime:
                  type: string
                  format: date-time
                  description: >-
                    Export start time (format: yyyy-MM-dd HH:mm:ss, Beijing
                    time; max 30 days range)
                  example: '2025-10-01 00:00:00'
                endTime:
                  type: string
                  format: date-time
                  description: >-
                    Export end time (format: yyyy-MM-dd HH:mm:ss, Beijing time;
                    must be after startTime)
                  example: '2025-10-31 23:59:59'
                domain:
                  type: string
                  description: >-
                    Filter by sending domain (exact match; only export spam
                    reports associated with the specified domain)
                  example: example.com
                labelName:
                  type: string
                  description: >-
                    Filter by email label (exact match with the label set when
                    sending)
                  example: Promotion
                mailServer:
                  type: string
                  description: >-
                    Filter by recipient's mail server (exact match; e.g.,
                    "Gmail", "Outlook")
                  example: Gmail
              required:
                - startTime
                - endTime
      security:
        - apiUser: []
          apiKey: []
  /api/spamreported/count:
    get:
      summary: Get Spam Report Count
      description: >-
        Get total number of spam-reported emails within a specified time range,
        including aggregated statistics by mail server and sending domain. The
        maximum query time range is 90 days.
      operationId: getSpamReportCountGet
      tags:
        - Complaint
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: >-
                      Response status code (200 = success; other codes indicate
                      failure)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Success or failure message (detailed error information for
                      failure scenarios)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request succeeded (true = success, false =
                      failure)
                    example: true
                  info:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: >-
                          Total number of spam-reported emails matching the
                          query conditions (sum of all platform and domain
                          reports)
                        example: 18
                      byMailServer:
                        type: object
                        description: >-
                          Spam count grouped by recipient's mail server (key =
                          mail server name, value = number of reports; helps
                          identify high-risk platforms)
                        example:
                          Gmail: 12
                          Outlook: 4
                          Yahoo: 2
                      byDomain:
                        type: object
                        description: >-
                          Spam count grouped by sending domain (key = sending
                          domain, value = number of reports; helps identify
                          problematic sending domains)
                        example:
                          example.com: 15
                          sub.example.com: 3
        '400':
          description: >-
            Bad request (e.g., time range exceeds 90 days, endTime earlier than
            startTime)
        '401':
          description: Authentication failed (invalid apiUser or apiKey)
      parameters:
        - in: query
          name: startTime
          schema:
            type: string
            format: date-time
          required: true
          description: >-
            Query start time (format: yyyy-MM-dd HH:mm:ss, Beijing time; max 90
            days range)
          example: '2025-10-01 00:00:00'
        - in: query
          name: endTime
          schema:
            type: string
            format: date-time
          required: true
          description: >-
            Query end time (format: yyyy-MM-dd HH:mm:ss, Beijing time; must be
            after startTime)
          example: '2025-10-31 23:59:59'
      security:
        - apiUser: []
          apiKey: []
  /api/spamreported/block:
    post:
      summary: Block Spam-Reported Address
      description: >-
        Add one or more spam-reported email addresses to the system's blocklist.
        After blocking, the system will permanently reject all future email
        sends to these addresses to protect sending reputation and comply with
        anti-spam regulations. Supports batch blocking (up to 100 addresses per
        request, separated by semicolons). Addresses already in the blocklist
        will be ignored.
      operationId: blockSpamReportedAddress
      tags:
        - Complaint
      responses:
        '200':
          description: Block successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 = block operation successful)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Block result message (e.g., "block successful" or "partial
                      addresses already blocked")
                    example: block successful
                  result:
                    type: boolean
                    description: >-
                      Whether the overall block operation succeeded (true =
                      all/partial addresses blocked; false = no addresses
                      blocked)
                    example: true
                  info:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: >-
                          Number of successfully blocked addresses (excludes
                          addresses already in the blocklist or invalid
                          addresses)
                        example: 1
        '400':
          description: >-
            Bad request (e.g., invalid email format, exceeding 100 addresses per
            request, empty email parameter, non-spam-reported addresses)
        '401':
          description: Authentication failed (invalid apiUser or apiKey)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: >-
                    Email address(es) to block (supports multiple addresses
                    separated by semicolons; max 100 addresses per request; must
                    be valid RFC 5322 format and have spam report records)
                  example: spam1@example.com;spam2@example.com
              required:
                - email
      security:
        - apiUser: []
          apiKey: []
components:
  securitySchemes:
    apiUser:
      type: apiKey
      in: query
      name: apiUser
      description: >-
        API_USER (authentication parameter; obtained from SendCloud console ->
        Email API -> API_USER)
    apiKey:
      type: apiKey
      in: query
      name: apiKey
      description: API_KEY (authentication parameter; keep confidential)
x-readme:
  explorer-enabled: true
  proxy-enabled: true
