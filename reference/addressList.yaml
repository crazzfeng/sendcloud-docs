                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Detailed information of the address list
                    properties:
                      total:
                        type: integer
                        description: Total number of address lists
                        example: 5
                      data:
                        type: array
                        description: List of address list objects
                        items:
                          type: object
                          properties:
                            address:
                              type: string
                              description: >-
                                Alias address of the address list (formatted as
                                xxx@maillist.sendcloud.org)
                              example: test@maillist.sendcloud.org
                            name:
                              type: string
                              description: Address list name
                              example: test
                            description:
                              type: string
                              description: Address list description (optional)
                              example: This is a test address list
                            memberCount:
                              type: integer
                              description: Number of members in the address list
                              example: 150
                            listType:
                              type: integer
                              description: List type
                              example: 0
                            gmtCreated:
                              type: string
                              format: date-time
                              description: >-
                                Address list creation time (format: yyyy-MM-dd
                                HH:mm:ss)
                              example: '2015-09-28 17:59:15'
                            gmtUpdated:
                              type: string
                              format: date-time
                              description: >-
                                Address list last update time (format:
                                yyyy-MM-dd HH:mm:ss)
                              example: '2015-09-28 17:59:15'
        '400':
          description: Bad request (e.g., invalid pagination parameters)
      parameters:
        - in: query
          name: start
          schema:
            type: integer
            default: 0
            minimum: 0
          required: false
          description: Query start position (pagination parameter, defaults to 0)
          example: 0
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 0
            maximum: 100
          required: false
          description: >-
            Number of results returned per query (pagination parameter, range
            0-100, defaults to 100)
          example: 5
      x-codeSamples:
        - lang: Python
          label: Get Address List (POST with JSON)
          source: |
            import requests
            import json

            url = "https://api.aurorasendcloud.com/api/addresslist/list"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key"
            }
            data = {
                "page": 1,
                "pageSize": 20
            }

            response = requests.post(url, params=params, json=data)
            result = response.json()
            print(f"Total address lists: {result['info']['total']}")
            print("Address list details:")
            for list_info in result['info']['data']:
                print(f"- Address: {list_info['address']}, Name: {list_info['name']}, Members: {list_info['memberCount']}")
        - lang: Python
          label: Get Address List (POST with Form Data)
          source: |
            import requests

            url = "https://api.aurorasendcloud.com/api/addresslist/list"
            data = {
