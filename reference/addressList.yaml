            }

            response = requests.post(url, data=data)
            result = response.json()
            print(f"Total address lists: {result['info']['total']}")
            print("Address list details:")
            for list_info in result['info']['data']:
                print(f"- Address: {list_info['address']}, Name: {list_info['name']}, Members: {list_info['memberCount']}")
  /api/addresslist/update:
    post:
      summary: Update Address List
      description: Modify the display name or description of an existing address list
      operationId: updateAddressList
      tags:
        - Address List
      security:
        - apiUser: []
        - apiKey: []
      responses:
        '200':
          description: Address list updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Update result statistics
                    properties:
                      count:
                        type: integer
                        description: >-
                          Number of address lists successfully updated (1 =
                          success, 0 = no update)
                        example: 1
        '400':
          description: Bad request (e.g., no parameters to update)
        '404':
          description: Address list not found (invalid list name)
      parameters:
        - in: query
          name: address
          schema:
            type: string
          required: true
          description: >-
            Address of the address list to update (unique identifier, cannot be
            modified)
          example: test@maillist.sendcloud.org
        - in: query
          name: newAddress
          schema:
            type: string
          required: false
          description: New address (optional, leave empty to keep the original)
          example: new_test@maillist.sendcloud.org
        - in: query
          name: name
          schema:
            type: string
          required: false
          description: New display name (optional, leave empty to keep the original)
          example: Updated Test Address List
        - in: query
          name: desc
          schema:
            type: string
          required: false
          description: >-
            New description (optional, leave empty to keep the original; pass
            empty string to clear)
          example: Updated description for test address list
      x-codeSamples:
        - lang: Python
          label: Update Address List (Display Name & Description)
          source: |
            import requests

            url = "https://api.aurorasendcloud.com/api/addresslist/update"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "address": "marketing@maillist.sendcloud.org",
                "name": "Updated Marketing List",
                "desc": "Updated address list for 2025 marketing campaigns"
            }

            response = requests.post(url, params=params)
            print(response.json())
  /api/addresslist/delete:
