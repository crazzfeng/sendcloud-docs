openapi: 3.0.0
info:
  version: 1.0.0
  title: Email
servers:
  - url: https://api.aurorasendcloud.com
tags:
  - name: Address List
    description: >-
      Interfaces for creating, querying, updating, deleting address lists and
      managing members
paths:
  /api/addresslist/add:
    post:
      summary: Add Address List
      description: >-
        Add a new email address list (supports setting list name and
        description)
      operationId: addAddressList
      tags:
        - Address List
      security:
        - apiUser: []
        - apiKey: []
      responses:
        '200':
          description: Address list added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Detailed information of the newly added address list
                    properties:
                      data:
                        type: object
                        properties:
                          address:
                            type: string
                            description: >-
                              Alias address of the address list (formatted as
                              xxx@maillist.sendcloud.org)
                            example: test@maillist.sendcloud.org
                          name:
                            type: string
                            description: Address list name
                            example: test
                          description:
                            type: string
                            description: Address list description (optional)
                            example: This is a test address list
                          memberCount:
                            type: integer
                            description: >-
                              Number of members in the address list (0 for new
                              list)
                            example: 0
                          listType:
                            type: integer
                            description: List type
                            example: 0
                          gmtCreated:
                            type: string
                            format: date-time
                            description: >-
                              Address list creation time (format: yyyy-MM-dd
                              HH:mm:ss)
                            example: '2015-09-28 17:59:15'
                          gmtUpdated:
                            type: string
                            format: date-time
                            description: >-
                              Address list last update time (format: yyyy-MM-dd
                              HH:mm:ss)
                            example: '2015-09-28 17:59:15'
        '400':
          description: Bad request (e.g., duplicate list name, missing required parameters)
      parameters:
        - in: query
          name: address
          schema:
            type: string
          required: true
          description: >-
            Alias address of the address list (formatted as
            xxx@maillist.sendcloud.org, used for invoking the list in sending
            emails)
          example: test@maillist.sendcloud.org
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Address list name
          example: test
        - in: query
          name: desc
          schema:
            type: string
          required: false
          description: Address list description (optional)
          example: This is a test address list
      x-codeSamples:
        - lang: Python
          label: Add Address List (Basic)
          source: |
            import requests

            url = "https://api.aurorasendcloud.com/api/addresslist/add"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "address": "test@maillist.sendcloud.org",
                "name": "test",
                "desc": "This is a test address list"
            }

            response = requests.post(url, params=params)
            print(response.json())
  /api/addresslist/list:
    get:
      summary: Get Address List
      description: >-
        Get the address list under the current apiUser (supports pagination
        query)
      operationId: getAddressList
      tags:
        - Address List
      security:
        - apiUser: []
        - apiKey: []
      responses:
        '200':
          description: Address list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Detailed information of the address list
                    properties:
                      total:
                        type: integer
                        description: Total number of address lists
                        example: 5
                      data:
                        type: array
                        description: List of address list objects
                        items:
                          type: object
                          properties:
                            address:
                              type: string
                              description: >-
                                Alias address of the address list (formatted as
                                xxx@maillist.sendcloud.org)
                              example: test@maillist.sendcloud.org
                            name:
                              type: string
                              description: Address list name
                              example: test
                            description:
                              type: string
                              description: Address list description (optional)
                              example: This is a test address list
                            memberCount:
                              type: integer
                              description: Number of members in the address list
                              example: 150
                            listType:
                              type: integer
                              description: List type
                              example: 0
                            gmtCreated:
                              type: string
                              format: date-time
                              description: >-
                                Address list creation time (format: yyyy-MM-dd
                                HH:mm:ss)
                              example: '2015-09-28 17:59:15'
                            gmtUpdated:
                              type: string
                              format: date-time
                              description: >-
                                Address list last update time (format:
                                yyyy-MM-dd HH:mm:ss)
                              example: '2015-09-28 17:59:15'
        '400':
          description: Bad request (e.g., invalid pagination parameters)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          required: false
          description: Page number (starting from 1, default 1)
          example: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
          required: false
          description: Number of items per page (default 100, max 500)
          example: 20
        - in: query
          name: keyword
          schema:
            type: string
          required: false
          description: Keyword search (supports searching by name or address)
          example: test
      x-codeSamples:
        - lang: Python
          label: Get Address List (Basic)
          source: |
            import requests

            url = "https://api.aurorasendcloud.com/api/addresslist/list"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "page": 1,
                "pageSize": 20
            }

            response = requests.get(url, params=params)
            print(response.json())
        - lang: Python
          label: Get Address List (With Keyword Search)
          source: |
            import requests

            url = "https://api.aurorasendcloud.com/api/addresslist/list"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "page": 1,
                "pageSize": 50,
                "keyword": "marketing"
            }

            response = requests.get(url, params=params)
            print(response.json())
    post:
      summary: Get Address List (POST)
      description: >-
        Get the address list under the current apiUser (supports pagination
        query, POST method recommended for complex parameters)
      operationId: getAddressListPost
      tags:
        - Address List
      security:
        - apiUser: []
        - apiKey: []
      responses:
        '200':
          description: Address list retrieved successfully
