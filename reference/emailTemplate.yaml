  /api/template/add:
    get:
      summary: Add Email Template (GET)
      description: >-
        Create a new email template (use POST for long/special character
        content)
      operationId: addTemplateGet
      tags:
        - Email Template Management
      responses:
        '200':
          description: Template created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: request was successful
                  result:
                    type: boolean
                    example: true
                  info:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          name:
                            type: string
                            example: test
                          invokeName:
                            type: string
                            example: testtemplate
                          templateType:
                            type: integer
                            enum:
                              - 0
                              - 1
                            example: 1
                          templateStat:
                            type: integer
                            example: 0
                          gmtCreated:
                            type: string
                            format: date-time
                            example: '2015-10-16 10:42:01'
                          gmtUpdated:
                            type: string
                            example: ''
                          html:
                            type: string
                            example: <p>add new template</p>
                          subject:
                            type: string
                            example: test_subject
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: API_USER
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: API_KEY
          example: test_api_key
        - in: query
          name: invokeName
          schema:
            type: string
          required: true
          description: Calling name of the new template
          example: testtemplate
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Name of the new template
          example: test
        - in: query
          name: html
          schema:
            type: string
          required: true
          description: Template content in HTML format (supports variables)
          example: <p>add new template</p>
        - in: query
          name: text
          schema:
            type: string
          required: false
          description: Template content in text format (optional)
          example: add new template
        - in: query
          name: subject
          schema:
            type: string
          required: true
          description: Subject of the new template
          example: test_subject
        - in: query
          name: templateType
          schema:
            type: integer
            enum:
              - 0
              - 1
          required: true
          description: Template type (0 = transactional, 1 = marketing)
          example: 1
      x-codeSamples:
        - lang: Python
          label: Add Template (GET, Simple Content)
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/template/add"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "invokeName": "new_test_template",
                "name": "Test Template",
                "html": "<h1>Hello {{name}}</h1><p>Your order {{order_id}} is confirmed</p>",
                "subject": "Order Confirmation",
                "templateType": 0  # Transactional template
            }

            response = requests.get(url, params=params)
            print(response.json())
    post:
      summary: Add Email Template (POST)
      description: >-
        Create a new email template (recommended for long/special character
        content)
      operationId: addTemplatePost
      tags:
        - Email Template Management
      responses:
        '200':
          description: Template created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: request was successful
                  result:
                    type: boolean
                    example: true
                  info:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          name:
                            type: string
                            example: test
                          invokeName:
                            type: string
                            example: testtemplate
                          templateType:
                            type: integer
                            enum:
                              - 0
                              - 1
                            example: 1
                          templateStat:
                            type: integer
                            example: 0
                          gmtCreated:
                            type: string
                            format: date-time
                            example: '2015-10-16 10:42:01'
                          gmtUpdated:
                            type: string
                            example: ''
                          html:
                            type: string
                            example: >-
                              <p>add new template with special characters:
                              &<>"'</p>
                          subject:
                            type: string
                            example: test_subject
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: API_USER
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: API_KEY
          example: test_api_key
        - in: query
          name: invokeName
          schema:
            type: string
          required: true
          description: Calling name of the new template
          example: testtemplate
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Name of the new template
          example: test
        - in: query
          name: html
          schema:
            type: string
          required: true
          description: Template content in HTML format (supports variables)
          example: '<p>add new template with special characters: &<>"''</p>'
        - in: query
          name: text
          schema:
            type: string
          required: false
          description: Template content in text format (optional)
          example: add new template with special characters
        - in: query
          name: subject
          schema:
            type: string
          required: true
          description: Subject of the new template
          example: test_subject
        - in: query
          name: templateType
          schema:
            type: integer
            enum:
              - 0
              - 1
          required: true
          description: Template type (0 = transactional, 1 = marketing)
          example: 1
      x-codeSamples:
        - lang: Python
          label: Add Template (POST, Special Characters)
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/template/add"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "invokeName": "special_char_template",
                "name": "Template with Special Chars",
                "html": "<p>Welcome &amp; Hello! This is a template with &lt;tags&gt; and \"quotes\"</p>",
                "text": "Welcome & Hello! This is a plain text template",
                "subject": "Special Characters Test",
                "templateType": 1  # Marketing template
            }

            response = requests.post(url, params=params)
            print(response.json())
