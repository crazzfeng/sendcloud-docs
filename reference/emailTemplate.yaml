openapi: 3.0.0
info:
  version: 1.0.0
  title: Aurora SendCloud Email Template API
servers:
  - url: https://api2.sendcloud.net
tags:
  - name: Email Template Management
    description: Interfaces for querying, adding, updating, and deleting email templates
paths:
  /api/template/list:
    get:
      summary: Batch Query Email Templates
      description: >-
        Query basic information of multiple email templates (supports filtering
        and pagination)
      operationId: batchQueryTemplatesGet
      tags:
        - Email Template Management
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: request was successful
                  result:
                    type: boolean
                    example: true
                  info:
                    type: object
                    properties:
                      dataList:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: ifaxin bill
                            invokeName:
                              type: string
                              example: ifaxin_bill_invoke
                            templateType:
                              type: integer
                              enum:
                                - 0
                                - 1
                              example: 1
                            templateStat:
                              type: integer
                              example: 1
                            gmtCreated:
                              type: string
                              format: date-time
                              example: '2013-11-21 16:37:41'
                            gmtUpdated:
                              type: string
                              format: date-time
                              example: '2015-06-12 19:44:07'
                      total:
                        type: integer
                        example: 42
                      count:
                        type: integer
                        example: 2
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: API_USER
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: API_KEY
          example: test_api_key
        - in: query
          name: invokeName
          schema:
            type: string
          required: false
          description: Calling name of the email template (filters results by template)
          example: ifaxin_bill
        - in: query
          name: templateType
          schema:
            type: integer
            enum:
              - 0
              - 1
          required: false
          description: Template type (0 = transactional, 1 = marketing)
          example: 0
        - in: query
          name: start
          schema:
            type: integer
            default: 0
            minimum: 0
          required: false
          description: Start position of the query (defaults to 0)
          example: 0
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 0
            maximum: 100
          required: false
          description: Number of results to return (0-100, defaults to 100)
          example: 3
      x-codeSamples:
        - lang: Python
          label: Batch Query Templates (Basic Filter)
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/template/list"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "templateType": 0,  # Transactional templates
                "start": 0,
                "limit": 10
            }

            response = requests.get(url, params=params)
            print(response.json())
        - lang: Python
          label: Batch Query Templates (By InvokeName)
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/template/list"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "invokeName": "ifaxin_bill",
                "limit": 1
            }

            response = requests.get(url, params=params)
            print(response.json())
    post:
      summary: Batch Query Email Templates (POST)
      description: >-
        Batch query email templates using POST method (supports filtering and
        pagination)
      operationId: batchQueryTemplatesPost
      tags:
        - Email Template Management
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: request was successful
                  result:
                    type: boolean
                    example: true
                  info:
                    type: object
                    properties:
                      dataList:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: ifaxin bill
                            invokeName:
                              type: string
                              example: ifaxin_bill_invoke
                            templateType:
                              type: integer
                              enum:
                                - 0
                                - 1
                              example: 1
                            templateStat:
                              type: integer
                              example: 1
                            gmtCreated:
                              type: string
                              format: date-time
                              example: '2013-11-21 16:37:41'
                            gmtUpdated:
                              type: string
                              format: date-time
                              example: '2015-06-12 19:44:07'
                      total:
                        type: integer
                        example: 42
                      count:
                        type: integer
                        example: 2
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: API_USER
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: API_KEY
          example: test_api_key
        - in: query
          name: invokeName
          schema:
            type: string
          required: false
          description: Calling name of the email template (filters results)
          example: ifaxin_bill
        - in: query
          name: templateType
          schema:
            type: integer
            enum:
              - 0
              - 1
          required: false
          description: Template type (0 = transactional, 1 = marketing)
          example: 0
        - in: query
          name: start
          schema:
            type: integer
            default: 0
            minimum: 0
          required: false
          description: Start position of the query
          example: 0
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 0
            maximum: 100
          required: false
          description: Number of results to return
          example: 3
      x-codeSamples:
        - lang: Python
          label: Batch Query Templates (POST Method)
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/template/list"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "templateType": 1,  # Marketing templates
                "start": 10,
                "limit": 20
            }

            response = requests.post(url, params=params)
            print(response.json())
  /api/template/get:
    get:
      summary: Query Single Email Template
      description: Get detailed information of a specific email template by invokeName
      operationId: getSingleTemplateGet
      tags:
        - Email Template Management
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: request was successful
                  result:
                    type: boolean
                    example: true
                  info:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          name:
                            type: string
                            example: SendCloud
                          invokeName:
                            type: string
                            example: 15_invoke_2
                          templateType:
                            type: integer
                            enum:
                              - 0
                              - 1
                            example: 0
                          templateStat:
                            type: integer
                            example: 1
                          gmtCreated:
                            type: string
                            format: date-time
                            example: '2015-02-02 17:01:43'
                          gmtUpdated:
                            type: string
                            format: date-time
                            example: '2015-04-16 15:04:12'
                          html:
                            type: string
                            example: >-
                              <p>Wonderful! You’ve successfully sent the first
                              testing email through SendCloud.</p>
                          subject:
                            type: string
                            example: The first Email from SendCloud！
                          contentSummary:
                            type: string
                            example: test summary
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: API_USER
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: API_KEY
          example: test_api_key
        - in: query
          name: invokeName
          schema:
            type: string
          required: true
          description: Calling name of the target email template
          example: test_invoke
      x-codeSamples:
        - lang: Python
          label: Query Single Template (GET)
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/template/get"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "invokeName": "test_invoke"
            }

            response = requests.get(url, params=params)
            template_info = response.json()
            print("Template Subject:", template_info["info"]["data"]["subject"])
            print("Template HTML:", template_info["info"]["data"]["html"])
    post:
