                                1447054895514_15555555_32350_1350.sc-inbound0$ben@example.com
                            sendRequestId:
                              type: string
                              description: Custom request ID (set when sending the email)
                              example: req_1234567890abcdef
                            from:
                              type: string
                              description: Sender email address
                              example: support@example.com
                            to:
                              type: string
                              description: Recipient email address
                              example: ben@example.com
                            subject:
                              type: string
                              description: Email subject
                              example: Test Email Subject
                            sendTime:
                              type: string
                              format: date-time
                              description: 'Email sending time (format: yyyy-MM-dd HH:mm:ss)'
                              example: '2025-10-15 14:30:00'
                            deliveryStatus:
