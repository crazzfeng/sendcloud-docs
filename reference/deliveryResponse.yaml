            url = "https://api.aurorasendcloud.com/api/deliver/query"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "to": "ben@example.com",
                "startTime": "2025-10-01 00:00:00",
                "endTime": "2025-10-31 23:59:59"
            }

            response = requests.post(url, params=params)
            print(response.json())
  /api/deliver/export:
    post:
      summary: Export Delivery Status Data
      description: >
        Export email delivery status data within a specified time range to a CSV
        file.


        Features:

        - Support for large data volume export

        - Asynchronous processing with task tracking

        - Multiple filtering options (domain, label, delivery status)

        - CSV file download with 24-hour validity

        - Maximum time range of 30 days
      operationId: exportDeliveryStatusData
      tags:
        - Delivery Response
      security:
        - apiUser: []
        - apiKey: []
      parameters:
        - in: query
          name: startTime
          schema:
            type: string
            format: date-time
          required: true
          description: >-
            Export start time (format: yyyy-MM-dd HH:mm:ss; maximum time range:
            30 days)
          example: '2025-10-01 00:00:00'
        - in: query
          name: endTime
          schema:
            type: string
            format: date-time
          required: true
          description: >-
            Export end time (format: yyyy-MM-dd HH:mm:ss; must be later than
            startTime)
          example: '2025-10-31 23:59:59'
        - in: query
          name: domain
          schema:
            type: string
          required: false
          description: >-
            Filter by sending domain (e.g., example.com; export all domains if
            not specified)
          example: example.com
        - in: query
          name: labelName
          schema:
            type: string
          required: false
          description: Filter by label name (export all labels if not specified)
          example: Marketing Campaigns
        - in: query
          name: deliveryStatus
          schema:
            type: string
            enum:
              - all
              - sent
              - delivered
              - bounced
              - failed
            default: all
          required: false
          description: Filter by delivery status (all = all statuses; default all)
          example: delivered
      responses:
        '200':
          description: Export task created successfully (return download URL)
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: export task created successfully
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Export task information
                    properties:
                      taskId:
                        type: string
                        description: Unique export task ID (used to query export status)
                        example: export_1234567890abcdef
                      downloadUrl:
                        type: string
                        description: >-
                          CSV file download URL (valid for 24 hours; empty if
                          export is in progress)
                        example: https://download.sendcloud.net/export/delivery_123.csv
                      status:
                        type: string
                        description: >-
                          Export task status (processing = in progress,
                          completed = completed, failed = failed)
                        example: processing
                      estimatedTime:
                        type: integer
                        description: >-
                          Estimated completion time (seconds; for large data
                          volume)
                        example: 120
        '400':
          description: Bad request (e.g., invalid time range, time range exceeding 30 days)
        '401':
          description: Authentication failed (invalid apiUser or apiKey)
      x-codeSamples:
        - lang: Python
          label: Export Delivered Emails Data
          source: >
            import requests

            import time


            url = "https://api.aurorasendcloud.com/api/deliver/export"

            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "startTime": "2025-10-01 00:00:00",
                "endTime": "2025-10-31 23:59:59",
                "domain": "example.com",
                "deliveryStatus": "delivered"
            }


            # Create export task

            response = requests.post(url, params=params)

            task_info = response.json()

            if not task_info["result"]:
                print(f"Export task failed: {task_info['message']}")
                exit()

            task_id = task_info["info"]["taskId"]

            print(f"Export task created. Task ID: {task_id}")

            print(f"Estimated completion time:
            {task_info['info']['estimatedTime']}s")


            # Poll task status until completed

            poll_url =
            "https://api.aurorasendcloud.com/api/deliver/export/status"

            while True:
                poll_params = {
                    "apiUser": "test_api_user",
                    "apiKey": "test_api_key",
                    "taskId": task_id
                }
                poll_response = requests.get(poll_url, params=poll_params)
                poll_result = poll_response.json()
                if poll_result["info"]["status"] == "completed":
                    download_url = poll_result["info"]["downloadUrl"]
                    print(f"Export completed. Download URL: {download_url}")
                    # Download the CSV file
                    csv_response = requests.get(download_url)
                    with open("delivery_export.csv", "wb") as f:
                        f.write(csv_response.content)
                    print("CSV file downloaded successfully as delivery_export.csv")
                    break
                elif poll_result["info"]["status"] == "failed":
                    print(f"Export failed: {poll_result['message']}")
                    break
                else:
                    print("Export in progress...")
                    time.sleep(10)  # Wait 10 seconds before polling again
  /api/deliver/export/status:
    get:
      summary: Query Export Task Status
      description: >
        Query the status of an export task and get download information when
        completed.


        Returns:

        - Task status (processing, completed, failed)

        - Download URL when completed

        - Progress information
      operationId: queryExportTaskStatus
      tags:
        - Delivery Response
      security:
        - apiUser: []
        - apiKey: []
      parameters:
        - in: query
          name: taskId
          schema:
            type: string
          required: true
          description: Export task ID (returned from export request)
          example: export_1234567890abcdef
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Export task status information
                    properties:
                      taskId:
                        type: string
                        description: Export task ID
                        example: export_1234567890abcdef
                      status:
                        type: string
                        description: >-
                          Export task status (processing = in progress,
                          completed = completed, failed = failed)
                        example: completed
                      downloadUrl:
                        type: string
                        description: >-
                          CSV file download URL (valid for 24 hours; empty if
                          not completed)
                        example: https://download.sendcloud.net/export/delivery_123.csv
                      createdAt:
                        type: string
                        format: date-time
                        description: Task creation time
                        example: '2025-10-15 14:30:00'
                      completedAt:
                        type: string
                        format: date-time
                        description: Task completion time (empty if not completed)
                        example: '2025-10-15 14:32:15'
                      fileSize:
                        type: integer
                        description: Exported file size in bytes (empty if not completed)
                        example: 1048576
        '400':
          description: Bad request (e.g., invalid taskId)
        '401':
          description: Authentication failed (invalid apiUser or apiKey)
        '404':
          description: Export task not found
      x-codeSamples:
        - lang: Python
          label: Query Export Task Status
          source: |
            import requests

            url = "https://api.aurorasendcloud.com/api/deliver/export/status"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "taskId": "export_1234567890abcdef"
            }

            response = requests.get(url, params=params)
            status_info = response.json()
            if status_info["result"]:
                task = status_info["info"]
                print(f"Task ID: {task['taskId']}")
                print(f"Status: {task['status']}")
                if task['status'] == 'completed':
                    print(f"Download URL: {task['downloadUrl']}")
                    print(f"File size: {task['fileSize']} bytes")
                elif task['status'] == 'processing':
                    print("Export is still in progress...")
            else:
                print(f"Query failed: {status_info['message']}")
components:
  securitySchemes:
    apiUser:
      type: apiKey
      in: query
      name: apiUser
      description: API_USER (authentication parameter, obtained from the SendCloud console)
    apiKey:
      type: apiKey
      in: query
      name: apiKey
      description: API_KEY (authentication parameter, obtained from the SendCloud console)
x-readme:
  explorer-enabled: true
  proxy-enabled: true
