  /api/domain/verify:
    post:
      summary: Verify Sending Domain
      description: >-
        Trigger verification of DNS records (SPF/DKIM/DMARC) for a
        pending/modified domain
      operationId: verifySendingDomain
      tags:
        - Domain
      responses:
        '200':
          description: >-
            Verification request submitted successfully (results will be
            returned after detection)
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: verification request submitted successfully
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Verification request result
                    properties:
                      domain:
                        type: string
                        description: Domain name being verified
                        example: example.com
                      status:
                        type: string
                        description: >-
                          Current domain status (pending_verify = verification
                          in progress, verified = verified, rejected = rejected)
                        example: pending_verify
        '400':
          description: >-
            Bad request (e.g., domain already verified, domain in rejected
            status)
        '404':
          description: >-
            Domain not found (domain not added or does not belong to the current
            apiUser)
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            API_USER (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            API_KEY (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_key
        - in: query
          name: domain
          schema:
            type: string
          required: true
          description: Sending domain name to verify (must be in pending status)
          example: example.com
      x-codeSamples:
        - lang: Python
          label: Verify Sending Domain (After DNS Configuration)
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/domain/verify"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "domain": "mycompany.com"  # Replace with actual domain (configured with required DNS records)
            }

            response = requests.post(url, params=params)
            print(response.json())
  /api/domain/delete:
    post:
      summary: Delete Sending Domain
      description: >-
        Delete an existing sending domain (verified domains can be deleted;
        pending/rejected domains are automatically cleaned up if not verified)
      operationId: deleteSendingDomain
      tags:
        - Domain
      responses:
        '200':
          description: Domain deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Deletion result statistics
                    properties:
                      count:
                        type: integer
                        description: >-
                          Number of domains successfully deleted (1 = success, 0
                          = no deletion)
                        example: 1
        '404':
          description: >-
            Domain not found (domain not added or does not belong to the current
            apiUser)
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            API_USER (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            API_KEY (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_key
        - in: query
          name: domain
          schema:
            type: string
          required: true
          description: Sending domain name to delete
          example: example.com
      x-codeSamples:
        - lang: Python
          label: Delete Sending Domain
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/domain/delete"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "domain": "obsolete-domain.com"  # Replace with actual domain to delete
            }

            response = requests.post(url, params=params)
            print(response.json())
  /api/domain/dkim/update:
    post:
      summary: Update DKIM Configuration
      description: >-
        Regenerate DKIM selector and public key for a verified sending domain
        (requires reconfiguring DNS)
      operationId: updateDKIMConfiguration
      tags:
        - Domain
      responses:
        '200':
          description: DKIM configuration updated successfully (new public key generated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: dkim configuration updated successfully
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: New DKIM configuration information
                    properties:
                      domain:
                        type: string
                        description: Sending domain name
                        example: example.com
                      dkimSelector:
                        type: string
                        description: New DKIM selector (to be reconfigured in DNS)
                        example: sc-selector-v2
                      dkimPublicKey:
                        type: string
                        description: New DKIM public key (to be reconfigured in DNS)
                        example: v=DKIM1; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAO...
                      status:
                        type: string
                        description: >-
                          Domain status (pending = pending re-verification after
                          DNS update)
                        example: pending
        '400':
          description: Bad request (e.g., domain not verified, update frequency exceeded)
        '404':
          description: >-
            Domain not found (domain not added or does not belong to the current
            apiUser)
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            API_USER (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            API_KEY (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_key
        - in: query
          name: domain
          schema:
            type: string
          required: true
          description: Sending domain name to update DKIM configuration (must be verified)
          example: example.com
      x-codeSamples:
        - lang: Python
          label: Update DKIM Configuration
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/domain/dkim/update"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "domain": "mycompany.com"  # Replace with actual verified domain
            }

            response = requests.post(url, params=params)
            dkim_info = response.json()
            if dkim_info["result"]:
                data = dkim_info["info"]
                print(f"New DKIM Selector: {data['dkimSelector']}")
                print(f"New DKIM Public Key: {data['dkimPublicKey']}")
                print("Note: Reconfigure DNS with the new DKIM record and re-verify the domain")
components:
