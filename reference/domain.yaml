openapi: 3.0.0
info:
  version: 1.0.0
  title: Email
servers:
  - url: https://api2.sendcloud.net
tags:
  - name: Domain
    description: >-
      Interfaces for adding, querying, verifying, and managing email sending
      domains
paths:
  /api/domain/add:
    post:
      summary: Add Sending Domain
      description: Add a new email sending domain (requires subsequent verification to use)
      operationId: addSendingDomain
      tags:
        - Domain
      responses:
        '200':
          description: Domain added successfully (pending verification)
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Detailed information of the added domain
                    properties:
                      domain:
                        type: string
                        description: Added sending domain name
                        example: example.com
                      status:
                        type: string
                        description: >-
                          Domain status (pending = pending verification,
                          verified = verified, rejected = rejected)
                        example: pending
                      gmtCreated:
                        type: string
                        format: date-time
                        description: 'Domain addition time (format: yyyy-MM-dd HH:mm:ss)'
                        example: '2025-10-08 11:00:00'
        '400':
          description: >-
            Bad request (e.g., invalid domain format, duplicate domain, domain
            already verified)
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            API_USER (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            API_KEY (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_key
        - in: query
          name: domain
          schema:
            type: string
          required: true
          description: >-
            Sending domain name (e.g., example.com, do not include "www" or
            "http")
          example: example.com
      x-codeSamples:
        - lang: Python
          label: Add Sending Domain
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/domain/add"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "domain": "mycompany.com"  # Replace with actual domain
            }

            response = requests.post(url, params=params)
            print(response.json())
  /api/domain/list:
    get:
      summary: Batch Query Sending Domains
      description: >-
        Query basic information of all added sending domains under the current
        apiUser
      operationId: batchQuerySendingDomainsGet
      tags:
        - Domain
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Batch query result data of sending domains
                    properties:
                      dataList:
                        type: array
                        description: List of sending domain basic information
                        items:
                          type: object
                          properties:
                            domain:
                              type: string
                              description: Sending domain name
                              example: example.com
                            status:
                              type: string
                              description: >-
                                Domain status (pending = pending verification,
                                verified = verified, rejected = rejected)
                              example: verified
                            spfStatus:
                              type: string
                              description: >-
                                SPF record verification status (pass = verified,
                                fail = not verified, none = not configured)
                              example: pass
                            dkimStatus:
                              type: string
                              description: >-
                                DKIM record verification status (pass =
                                verified, fail = not verified, none = not
                                configured)
                              example: pass
                            dmarcStatus:
                              type: string
                              description: >-
                                DMARC record verification status (pass =
                                verified, fail = not verified, none = not
                                configured)
                              example: pass
                            gmtCreated:
                              type: string
                              format: date-time
                              description: Domain addition time
                              example: '2025-10-08 11:00:00'
                            gmtVerified:
                              type: string
                              format: date-time
                              description: Domain verification time (empty if not verified)
                              example: '2025-10-08 14:30:00'
                      total:
                        type: integer
                        description: >-
                          Total number of sending domains under the current
                          apiUser
                        example: 3
                      count:
                        type: integer
                        description: >-
                          Number of domains returned (equals total for this
                          interface)
                        example: 3
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            API_USER (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            API_KEY (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_key
      x-codeSamples:
        - lang: Python
          label: Batch Query Sending Domains (GET)
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/domain/list"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key"
            }

            response = requests.get(url, params=params)
            result = response.json()
            print(f"Total sending domains: {result['info']['total']}")
            print("Domain details:")
            for domain in result['info']['dataList']:
                print(f"- Domain: {domain['domain']}, Status: {domain['status']}, SPF: {domain['spfStatus']}, DKIM: {domain['dkimStatus']}")
    post:
      summary: Batch Query Sending Domains (POST)
      description: Batch query all sending domains using POST method
      operationId: batchQuerySendingDomainsPost
      tags:
        - Domain
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Batch query result data of sending domains
                    properties:
                      dataList:
                        type: array
                        description: List of sending domain basic information
                        items:
                          type: object
                          properties:
                            domain:
                              type: string
                              description: Sending domain name
                              example: example.com
                            status:
                              type: string
                              description: >-
                                Domain status (pending = pending verification,
                                verified = verified, rejected = rejected)
                              example: verified
                            spfStatus:
                              type: string
                              description: >-
                                SPF record verification status (pass = verified,
                                fail = not verified, none = not configured)
                              example: pass
                            dkimStatus:
                              type: string
                              description: >-
                                DKIM record verification status (pass =
                                verified, fail = not verified, none = not
                                configured)
                              example: pass
                            dmarcStatus:
                              type: string
                              description: >-
                                DMARC record verification status (pass =
                                verified, fail = not verified, none = not
                                configured)
                              example: pass
                            gmtCreated:
                              type: string
                              format: date-time
                              description: Domain addition time
                              example: '2025-10-08 11:00:00'
                            gmtVerified:
                              type: string
                              format: date-time
                              description: Domain verification time (empty if not verified)
                              example: '2025-10-08 14:30:00'
                      total:
                        type: integer
                        description: >-
                          Total number of sending domains under the current
                          apiUser
                        example: 3
                      count:
                        type: integer
                        description: >-
                          Number of domains returned (equals total for this
                          interface)
                        example: 3
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            API_USER (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            API_KEY (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_key
      x-codeSamples:
        - lang: Python
          label: Batch Query Sending Domains (POST Method)
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/domain/list"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key"
            }

            response = requests.post(url, params=params)
            print(response.json())
  /api/domain/get:
    get:
      summary: Query Single Sending Domain
      description: >-
        Get detailed information (including DNS configuration) of a specific
        sending domain by domain name
      operationId: getSingleSendingDomainGet
      tags:
        - Domain
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Detailed information of the queried sending domain
                    properties:
                      data:
                        type: object
                        properties:
                          domain:
                            type: string
                            description: Sending domain name
                            example: example.com
                          status:
                            type: string
                            description: >-
                              Domain status (pending = pending verification,
                              verified = verified, rejected = rejected)
                            example: verified
                          spfStatus:
                            type: string
                            description: >-
                              SPF record verification status (pass = verified,
                              fail = not verified, none = not configured)
                            example: pass
                          spfRecord:
                            type: string
                            description: Required SPF record (to be configured in DNS)
                            example: v=spf1 include:spf.sendcloud.net ~all
                          dkimStatus:
                            type: string
                            description: >-
                              DKIM record verification status (pass = verified,
                              fail = not verified, none = not configured)
                            example: pass
                          dkimSelector:
                            type: string
                            description: DKIM selector (used for DNS configuration)
                            example: sc-selector
                          dkimPublicKey:
                            type: string
                            description: DKIM public key (to be configured in DNS)
                            example: v=DKIM1; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAO...
                          dmarcStatus:
                            type: string
                            description: >-
                              DMARC record verification status (pass = verified,
                              fail = not verified, none = not configured)
                            example: pass
                          dmarcRecord:
                            type: string
                            description: Recommended DMARC record (to be configured in DNS)
                            example: >-
                              v=DMARC1; p=none; sp=none;
                              rua=mailto:dmarc@example.com
                          gmtCreated:
                            type: string
                            format: date-time
                            description: Domain addition time
                            example: '2025-10-08 11:00:00'
                          gmtVerified:
                            type: string
                            format: date-time
                            description: Domain verification time (empty if not verified)
                            example: '2025-10-08 14:30:00'
        '404':
          description: >-
            Domain not found (domain not added or does not belong to the current
            apiUser)
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            API_USER (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            API_KEY (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_key
        - in: query
          name: domain
          schema:
            type: string
          required: true
          description: Target sending domain name (e.g., example.com)
          example: example.com
      x-codeSamples:
        - lang: Python
          label: Query Single Sending Domain (GET)
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/domain/get"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "domain": "mycompany.com"  # Replace with actual domain
            }

            response = requests.get(url, params=params)
            domain_info = response.json()
            if domain_info["result"]:
                data = domain_info["info"]["data"]
                print(f"Domain: {data['domain']}")
                print(f"Status: {data['status']}")
                print(f"SPF Record: {data['spfRecord']}")
                print(f"DKIM Selector: {data['dkimSelector']}")
                print(f"DMARC Record: {data['dmarcRecord']}")
