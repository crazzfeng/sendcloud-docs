                                false}}
                            notifyEmail:
                              type: string
                              description: Notification email (empty if not set)
                              example: admin1@example.com;admin2@example.com
                            isNotify:
                              type: boolean
                              description: Whether email notifications are enabled
                              example: true
                            gmtCreated:
                              type: string
                              format: date-time
                              description: Creation time of the sub-API user
                              example: '2025-10-10 15:20:00'
                            gmtUpdated:
                              type: string
                              format: date-time
                              description: Last update time of the sub-API user
                              example: '2025-10-11 09:30:00'
                      total:
                        type: integer
                        description: Total number of sub-API users under the main account
                        example: 5
                      count:
                        type: integer
                        description: >-
                          Number of sub-API users returned (equals total for
                          this interface)
                        example: 5
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            Main account API_USER (authentication parameter, obtained from the
            SendCloud console)
          example: main_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            Main account API_KEY (authentication parameter, obtained from the
            SendCloud console)
          example: main_api_key_7890
      x-codeSamples:
        - lang: Python
          label: Batch Query Sub-API Users (GET)
          source: |
            import requests
            import json

            url = "https://api2.sendcloud.net/api/apiuser/list"
            params = {
                "apiUser": "main_api_user",
                "apiKey": "main_api_key_7890"
            }

            response = requests.get(url, params=params)
            result = response.json()
            print(f"Total sub-API users: {result['info']['total']}")
            print("Sub-API user details:")
            for user in result['info']['dataList']:
                permission = json.loads(user['permission'])
                print(f"- User: {user['apiUser']}, Notify: {user['isNotify']}, Permissions: {permission}")
