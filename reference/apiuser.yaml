  /api/apiuser/update:
    post:
      summary: Update Sub-API User
      description: >-
        Modify the permissions, notification email, or notification switch of an
        existing sub-API user
      operationId: updateSubApiUser
      tags:
        - API_User
      responses:
        '200':
          description: Sub-API user updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Update result statistics
                    properties:
                      count:
                        type: integer
                        description: >-
                          Number of sub-API users successfully updated (1 =
                          success, 0 = no update)
                        example: 1
        '400':
          description: >-
            Bad request (e.g., invalid permission configuration, no parameters
            to update)
        '404':
          description: >-
            Sub-API user not found (user name does not exist under the main
            account)
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            Main account API_USER (authentication parameter, obtained from the
            SendCloud console)
          example: main_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            Main account API_KEY (authentication parameter, obtained from the
            SendCloud console)
          example: main_api_key_7890
        - in: query
          name: subApiUser
          schema:
            type: string
          required: true
          description: Name of the sub-API user to update (cannot be modified)
          example: sub_test_api_user
        - in: query
          name: permission
          schema:
            type: string
          required: false
          description: >-
            New permission configuration (JSON format; leave empty to keep
            original)
          example: >-
            {"mail": {"send": true, "sendtemplate": true, "sendcalendar": true},
            "maillist": {"create": true}}
        - in: query
          name: notifyEmail
          schema:
            type: string
          required: false
          description: >-
            New notification email (multiple emails separated by semicolons;
            leave empty to keep original; pass empty string to clear)
          example: new_admin@example.com
        - in: query
          name: isNotify
          schema:
            type: string
            enum:
              - true
              - false
          required: false
          description: New notification switch status; leave empty to keep original
          example: 'false'
      x-codeSamples:
        - lang: Python
          label: Update Sub-API User (Permissions & Notify Switch)
          source: >
            import requests

            import json


            url = "https://api2.sendcloud.net/api/apiuser/update"

            # Updated permission configuration: add calendar sending and address
            list creation permissions

            new_permission = {
                "mail": {"send": True, "sendtemplate": True, "sendcalendar": True},
                "maillist": {"create": True, "list": True},
                "label": {"create": False}
            }

            params = {
                "apiUser": "main_api_user",
                "apiKey": "main_api_key_7890",
                "subApiUser": "sub_marketing_user",
                "permission": json.dumps(new_permission),
                "isNotify": "false"  # Disable email notifications
            }


            response = requests.post(url, params=params)

            print(response.json())
  /api/apiuser/delete:
    post:
      summary: Delete Sub-API User
      description: >-
        Delete an existing sub-API user (the user's historical data is retained,
        but the user can no longer use the API)
      operationId: deleteSubApiUser
      tags:
        - API_User
      responses:
        '200':
          description: Sub-API user deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Deletion result statistics
                    properties:
                      count:
                        type: integer
                        description: >-
                          Number of sub-API users successfully deleted (1 =
                          success, 0 = no deletion)
                        example: 1
        '404':
          description: >-
            Sub-API user not found (user name does not exist under the main
            account)
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            Main account API_USER (authentication parameter, obtained from the
            SendCloud console)
          example: main_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            Main account API_KEY (authentication parameter, obtained from the
            SendCloud console)
          example: main_api_key_7890
        - in: query
          name: subApiUser
          schema:
            type: string
          required: true
          description: Name of the sub-API user to delete
          example: sub_test_api_user
      x-codeSamples:
        - lang: Python
          label: Delete Sub-API User
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/apiuser/delete"
            params = {
                "apiUser": "main_api_user",
                "apiKey": "main_api_key_7890",
                "subApiUser": "obsolete_sub_user"
            }

            response = requests.post(url, params=params)
            print(response.json())
  /api/apiuser/reset:
    post:
      summary: Reset Sub-API User Key
      description: >-
        Regenerate the API key of an existing sub-API user (the old key will
        become invalid immediately)
      operationId: resetSubApiUserKey
      tags:
        - API_User
      responses:
        '200':
          description: Sub-API user key reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: api key reset successfully
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: New API key information
                    properties:
                      apiUser:
                        type: string
                        description: Sub-API user name
                        example: sub_test_api_user
                      newApiKey:
                        type: string
                        description: >-
                          New API key (replace the old key for subsequent API
                          calls)
                        example: new_sub_api_key_654321
        '404':
          description: >-
            Sub-API user not found (user name does not exist under the main
            account)
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            Main account API_USER (authentication parameter, obtained from the
            SendCloud console)
          example: main_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            Main account API_KEY (authentication parameter, obtained from the
            SendCloud console)
          example: main_api_key_7890
        - in: query
          name: subApiUser
          schema:
            type: string
          required: true
          description: Name of the sub-API user to reset the key
          example: sub_test_api_user
      x-codeSamples:
        - lang: Python
          label: Reset Sub-API User Key
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/apiuser/reset"
            params = {
                "apiUser": "main_api_user",
                "apiKey": "main_api_key_7890",
                "subApiUser": "sub_marketing_user"
            }

            response = requests.post(url, params=params)
            reset_info = response.json()
            if reset_info["result"]:
                print(f"Sub-API User: {reset_info['info']['apiUser']}")
                print(f"New API Key: {reset_info['info']['newApiKey']}")
                print("Warning: The old API key is now invalid. Update your configuration immediately.")
components:
  securitySchemes:
    apiUser:
      type: apiKey
      in: query
      name: apiUser
