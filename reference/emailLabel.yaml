openapi: 3.0.0
info:
  version: 1.0.0
  title: Email
servers:
  - url: https://api2.sendcloud.net
tags:
  - name: Email Label
    description: Interfaces for creating, querying, updating, and deleting email labels
paths:
  /api/label/create:
    post:
      summary: Create Label
      description: Create a new email label (supports setting label name and color)
      operationId: createLabel
      tags:
        - Email Label
      responses:
        '200':
          description: Label created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Detailed information of the newly created label
                    properties:
                      id:
                        type: integer
                        description: Unique ID of the label (system-generated)
                        example: 12345
                      name:
                        type: string
                        description: Label name (unique under the current apiUser)
                        example: Test Label
                      color:
                        type: string
                        description: Label color (hex format, e.g.,
                        example: '#FF5733'
                      gmtCreated:
                        type: string
                        format: date-time
                        description: 'Label creation time (format: yyyy-MM-dd HH:mm:ss)'
                        example: '2025-10-05 09:20:00'
        '400':
          description: Bad request (e.g., duplicate label name, invalid color format)
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            API_USER (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            API_KEY (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_key
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: >-
            Label name (unique under the current apiUser, used for management
            and sending emails)
          example: Test Label
        - in: query
          name: color
          schema:
            type: string
          required: false
          description: Label color (hex format starting with
          example: '#FF5733'
      x-codeSamples:
        - lang: Python
          label: Create Label (With Custom Color)
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/label/create"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "name": "Marketing Campaigns",
                "color": "#2ECC71"  # Green color
            }

            response = requests.post(url, params=params)
            print(response.json())
  /api/label/list:
    get:
      summary: Batch Query Labels
      description: Query basic information of all labels under the current apiUser
      operationId: batchQueryLabelsGet
      tags:
        - Email Label
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Batch query result data of labels
                    properties:
                      dataList:
                        type: array
                        description: List of label basic information
                        items:
                          type: object
