  /api/label/update:
    post:
      summary: Update Label
      description: Modify the name or color of an existing label
      operationId: updateLabel
      tags:
        - Email Label
      responses:
        '200':
          description: Label updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Update result statistics
                    properties:
                      count:
                        type: integer
                        description: >-
                          Number of labels successfully updated (1 = success, 0
                          = no update)
                        example: 1
        '400':
          description: >-
            Bad request (e.g., duplicate label name, invalid color format, no
            parameters to update)
        '404':
          description: Label not found (invalid label ID)
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            API_USER (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            API_KEY (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_key
        - in: query
          name: id
          schema:
            type: integer
          required: true
          description: Unique ID of the label to update (cannot be modified)
          example: 12345
        - in: query
          name: name
          schema:
            type: string
          required: false
          description: >-
            New label name (optional, must be unique if provided; leave empty to
            keep original)
          example: Updated Test Label
        - in: query
          name: color
          schema:
            type: string
          required: false
          description: New label color (optional, hex format; leave empty to keep original)
          example: '#3498DB'
      x-codeSamples:
        - lang: Python
          label: Update Label (Name & Color)
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/label/update"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "id": 12345,  # Replace with actual label ID
                "name": "2025 Marketing Campaigns",
                "color": "#E74C3C"  # Red color
            }

            response = requests.post(url, params=params)
            print(response.json())
  /api/label/delete:
    post:
      summary: Delete Label
      description: >-
        Delete an existing label (emails tagged with this label will retain the
        tag but the label will no longer be available for new emails)
      operationId: deleteLabel
      tags:
        - Email Label
      responses:
        '200':
          description: Label deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Deletion result statistics
                    properties:
                      count:
                        type: integer
                        description: >-
                          Number of labels successfully deleted (1 = success, 0
                          = no deletion)
                        example: 1
        '404':
          description: Label not found (invalid label ID)
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            API_USER (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            API_KEY (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_key
        - in: query
          name: id
          schema:
            type: integer
          required: true
          description: Unique ID of the label to delete
          example: 12345
      x-codeSamples:
        - lang: Python
          label: Delete Label
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/label/delete"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "id": 12345  # Replace with actual label ID
            }

            response = requests.post(url, params=params)
            print(response.json())
components:
  securitySchemes:
    apiUser:
      type: apiKey
      in: query
      name: apiUser
      description: Authentication parameter (API_USER, obtained from the SendCloud console)
    apiKey:
      type: apiKey
      in: query
      name: apiKey
      description: Authentication parameter (API_KEY, obtained from the SendCloud console)
x-readme:
  explorer-enabled: true
  proxy-enabled: true
