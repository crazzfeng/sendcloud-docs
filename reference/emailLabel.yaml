            response = requests.post(url, params=params)
            print(response.json())
  /api/label/get:
    get:
      summary: Query Single Label
      description: Get detailed information of a specific label by label ID
      operationId: getSingleLabelGet
      tags:
        - Email Label
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Detailed information of the queried label
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Unique ID of the label
                            example: 12345
                          name:
                            type: string
                            description: Label name
                            example: Test Label
                          color:
                            type: string
                            description: Label color (hex format)
                            example: '#FF5733'
                          gmtCreated:
