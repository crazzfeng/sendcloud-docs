                              example: '#FF5733'
                            gmtCreated:
                              type: string
                              format: date-time
                              description: Label creation time
                              example: '2025-10-05 09:20:00'
                            gmtUpdated:
                              type: string
                              format: date-time
                              description: Label last update time
                              example: '2025-10-05 10:30:00'
                      total:
                        type: integer
                        description: Total number of labels under the current apiUser
                        example: 8
                      count:
                        type: integer
                        description: >-
                          Number of labels returned (equals total for this
                          interface)
                        example: 8
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            API_USER (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_user
        - in: query
          name: apiKey
          schema:
            type: string
          required: true
          description: >-
            API_KEY (authentication parameter, obtained from the SendCloud
            console)
          example: test_api_key
      x-codeSamples:
        - lang: Python
          label: Batch Query All Labels (GET)
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/label/list"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key"
            }

            response = requests.get(url, params=params)
            result = response.json()
            print(f"Total labels: {result['info']['total']}")
            print("Label details:")
            for label in result['info']['dataList']:
                print(f"- ID: {label['id']}, Name: {label['name']}, Color: {label['color']}")
    post:
      summary: Batch Query Labels (POST)
      description: Batch query all labels using POST method
