          example: test_api_key
      x-codeSamples:
        - lang: Python
          label: Batch Query All Labels (POST Method)
          source: |
            import requests

            url = "https://api2.sendcloud.net/api/label/list"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key"
