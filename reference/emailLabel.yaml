                    example: true
                  info:
                    type: object
                    description: Batch query result data of labels
                    properties:
                      dataList:
                        type: array
                        description: List of label basic information
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Unique ID of the label
                              example: 12345
                            name:
                              type: string
                              description: Label name
                              example: Test Label
                            color:
                              type: string
                              description: Label color (hex format)
                              example: '#FF5733'
                            gmtCreated:
                              type: string
                              format: date-time
                              description: Label creation time
                              example: '2025-10-05 09:20:00'
                            gmtUpdated:
                              type: string
                              format: date-time
                              description: Label last update time
                              example: '2025-10-05 10:30:00'
                      total:
                        type: integer
                        description: Total number of labels under the current apiUser
                        example: 8
                      count:
                        type: integer
                        description: >-
                          Number of labels returned (equals total for this
                          interface)
                        example: 8
      parameters:
        - in: query
          name: apiUser
          schema:
            type: string
          required: true
          description: >-
            API_USER (authentication parameter, obtained from the SendCloud
