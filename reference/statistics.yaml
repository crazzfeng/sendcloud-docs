            }

            response = requests.post(url, params=params)
            print(response.json())
  /api/stats/daily:
    get:
      summary: Query Daily Sending Statistics
      description: >-
        Get daily breakdown of email sending statistics within a specified time
        range
      operationId: queryDailySendingStatsGet
      tags:
        - Statistics
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: Response status code (200 indicates success)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Prompt message for request result (success/failure
                      description)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request was processed successfully (true =
                      success, false = failure)
                    example: true
                  info:
                    type: object
                    description: Daily sending statistics
                    properties:
                      startTime:
                        type: string
                        format: date-time
                        description: 'Query start time (format: yyyy-MM-dd HH:mm:ss)'
                        example: '2025-10-01 00:00:00'
                      endTime:
                        type: string
                        format: date-time
                        description: 'Query end time (format: yyyy-MM-dd HH:mm:ss)'
                        example: '2025-10-07 23:59:59'
                      dataList:
                        type: array
                        description: Daily statistics list
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              format: date
                              description: 'Statistical date (format: yyyy-MM-dd)'
                              example: '2025-10-01'
                            totalSent:
                              type: integer
                              description: Number of emails sent on the date
                              example: 1200
                            totalDelivered:
                              type: integer
                              description: Number of emails delivered on the date
                              example: 1152
                            deliveryRate:
                              type: number
                              format: float
                              description: Delivery rate on the date (保留2位小数)
                              example: 96
                            totalOpened:
                              type: integer
                              description: Number of emails opened on the date
                              example: 461
                            openRate:
                              type: number
                              format: float
                              description: Open rate on the date (保留2位小数)
                              example: 40
                            totalClicked:
                              type: integer
                              description: Number of links clicked on the date
                              example: 138
                            clickRate:
                              type: number
                              format: float
                              description: Click rate on the date (保留2位小数)
                              example: 12
                      totalDays:
                        type: integer
                        description: Number of statistical days (endTime - startTime + 1)
                        example: 7
        '400':
          description: Bad request (e.g., invalid time range, time range exceeding 90 days)
        '401':
          description: Authentication failed (invalid apiUser or apiKey)
      parameters:
        - in: query
          name: startTime
          schema:
            type: string
            format: date-time
          required: true
          description: >-
