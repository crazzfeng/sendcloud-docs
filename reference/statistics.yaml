          example: '2025-10-01 00:00:00'
        - in: query
          name: endTime
          schema:
            type: string
            format: date-time
          required: true
          description: >-
            Query end time (format: yyyy-MM-dd HH:mm:ss; must be later than
            startTime)
          example: '2025-10-07 23:59:59'
        - in: query
          name: domain
          schema:
            type: string
          required: false
          description: >-
            Filter by sending domain (e.g., example.com; query all domains if
            not specified)
          example: example.com
        - in: query
          name: labelName
          schema:
            type: string
          required: false
          description: Filter by label name (query all labels if not specified)
          example: Marketing Campaigns
      security:
        - apiUser: []
          apiKey: []
      x-codeSamples:
        - lang: Python
          label: Query Weekly Daily Sending Stats
          source: |
            import requests

            url = "https://api.aurorasendcloud.com/api/stats/daily"
            params = {
                "apiUser": "test_api_user",
                "apiKey": "test_api_key",
                "startTime": "2025-10-01 00:00:00",
                "endTime": "2025-10-07 23:59:59",
                "labelName": "Weekly Newsletter"
            }

            response = requests.get(url, params=params)
            stats = response.json()
            if stats["result"]:
                print(f"Time Range: {stats['info']['startTime']} - {stats['info']['endTime']}")
                print("Daily Statistics:")
                for day in stats['info']['dataList']:
                    print(f"- {day['date']}: Sent={day['totalSent']}, Delivered={day['totalDelivered']}, OpenRate={day['openRate']}%")
