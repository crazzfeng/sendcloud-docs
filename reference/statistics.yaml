                            spamReportedNum:
                              type: integer
                              description: Number of spam reporting
                              example: 0
                            unsubscribeNum:
                              type: integer
                              description: Unsubscribes
                              example: 0
                            uniqueOpensNum:
                              type: integer
                              description: Unique opens
                              example: 0
                            uniqueClicksNum:
                              type: integer
                              description: Unique clicks
                              example: 0
                            invalidEmailsNum:
                              type: integer
                              description: Number of invalid emails
                              example: 5
                            deliveredPercent:
                              type: number
                              description: Percentage of deliveries
                              example: 75
                            clickPercent:
                              type: number
                              description: Percentage of clicks
                              example: 0
                            openPercent:
                              type: number
                              description: Percentage of opens
                              example: 0
                            bouncePercent:
                              type: number
                              description: Percentage of bounces
                              example: 0
                            spamReportedPercent:
                              type: number
                              description: Percentage of spam reporting
