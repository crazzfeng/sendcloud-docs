openapi: 3.0.3
info:
  title: SendCloud API Documentation - Opens And Clicks
  description: >
    SendCloud email open and click statistics API documentation.


    This module provides APIs for querying email open and click statistics,
    including:

    - Summary statistics (total opens, clicks, rates)

    - Detailed time-series statistics with multiple aggregation levels

    - Multi-dimensional filtering by labels, domains, tags, and templates


    Authentication:

    All APIs require authentication using apiUser and apiKey query parameters.


    Time Zone:

    All time parameters use Beijing time (GMT+8).


    Rate Limits:

    - Maximum query time range: 90 days

    - Query frequency limit: 10 times/minute
  version: 1.0.0
  contact:
    name: SendCloud Support
    url: https://www.sendcloud.net
    email: support@sendcloud.net
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.aurorasendcloud.com
    description: Production server
  - url: https://api.sendcloud.net
    description: Alternative production server
tags:
  - name: Opens And Clicks Statistics
    description: Email open and click statistics management APIs
paths:
  /api/stat/openclick/summary:
    get:
      summary: Query Open & Click Summary Statistics
      description: >-
        Get summary statistics of email open and click data within a specified
        time range. Supports multi-dimensional filtering. The maximum query time
        range is 90 days; time parameters use Beijing time (GMT+8).
      operationId: queryOpenClickSummaryGet
      tags:
        - Opens And Clicks Statistics
      security:
        - apiUser: []
          apiKey: []
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    description: >-
                      Response status code (200 = success; other codes indicate
                      failure)
                    example: 200
                  message:
                    type: string
                    description: >-
                      Success or failure message (detailed error information for
                      failure scenarios)
                    example: request was successful
                  result:
                    type: boolean
                    description: >-
                      Whether the request succeeded (true = success, false =
                      failure)
                    example: true
                  info:
                    type: object
                    properties:
                      totalSend:
                        type: integer
                        description: Total send volume across the entire query time range
                        example: 10000
                      totalOpen:
                        type: integer
                        description: >-
                          Total unique open volume across the entire query time
                          range
                        example: 3250
                      totalClick:
                        type: integer
                        description: >-
                          Total unique click volume across the entire query time
                          range
                        example: 860
                      openRate:
                        type: number
                        format: float
                        description: >-
                          Overall open rate across the entire query time range
                          (totalOpen / totalSend; retains 4 decimal places)
                        example: 0.325
                      clickRate:
                        type: number
                        format: float
                        description: >-
                          Overall click rate across the entire query time range
                          (totalClick / totalSend; retains 4 decimal places)
                        example: 0.086
                      clickToOpenRate:
                        type: number
                        format: float
                        description: >-
                          Overall click-to-open rate across the entire query
                          time range (totalClick / totalOpen; retains 4 decimal
                          places; 0 if totalOpen is 0)
                        example: 0.2646
        '400':
          description: >-
            Bad request (e.g., time range exceeds 90 days, invalid filter
            parameter format)
        '401':
          description: Authentication failed (invalid apiUser or apiKey)
      parameters:
        - in: query
          name: startTime
          schema:
            type: string
            format: date-time
          required: true
          description: >-
            Query start time (format: yyyy-MM-dd HH:mm:ss, Beijing time; max 90
            days range)
          example: '2025-10-01 00:00:00'
        - in: query
          name: endTime
          schema:
            type: string
            format: date-time
          required: true
          description: >-
            Query end time (format: yyyy-MM-dd HH:mm:ss, Beijing time; must be
            after startTime)
          example: '2025-10-31 23:59:59'
        - in: query
          name: labelName
          schema:
            type: string
          required: false
          description: >-
            Filter by email label (exact match; multiple labels separated by
            semicolons)
          example: Promotion;Notification
        - in: query
          name: fromDomain
          schema:
            type: string
          required: false
          description: >-
            Filter by sender domain (exact match; multiple domains separated by
            semicolons)
          example: example.com;sub.example.com
        - in: query
          name: tag
          schema:
            type: string
          required: false
          description: >-
            Filter by send tag (exact match; multiple tags separated by
            semicolons)
          example: tag1;tag2
        - in: query
          name: templateInvokeName
          schema:
            type: string
          required: false
          description: >-
            Filter by template calling name (exact match; multiple templates
            separated by semicolons)
          example: ifaxin_bill;ifaxin_notify
      x-codeSamples:
        - lang: Python
          label: Query Open & Click Summary (GET)
          source: |
            import requests

            url = "https://api.aurorasendcloud.com/api/stat/openclick/summary"
            params = {
                "startTime": "2025-10-01 00:00:00",
                "endTime": "2025-10-31 23:59:59",
                "tag": "tag1;tag2",
                "templateInvokeName": "ifaxin_bill;ifaxin_notify"
            }

            response = requests.get(url, params=params)
            print(response.json())
    post:
      summary: Query Open & Click Summary Statistics (POST)
      description: >-
        Query summary statistics using POST method. Suitable for scenarios with
