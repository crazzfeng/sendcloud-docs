                        example: 0.086
                      clickToOpenRate:
                        type: number
                        format: float
                        description: >-
                          Overall click-to-open rate of the query time range
                          (retains 4 decimal places)
                        example: 0.2646
        '400':
          description: >-
            Bad request (e.g., invalid granularity type, time range exceeds 90
            days)
        '401':
          description: Authentication failed (invalid apiUser or apiKey)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                startTime:
