components:
  securitySchemes:
    apiUser:
      type: apiKey
      in: query
      name: apiUser
      description: API user name for authentication
    apiKey:
      type: apiKey
      in: query
      name: apiKey
      description: API key for authentication
x-readme:
  explorer-enabled: true
  proxy-enabled: true
