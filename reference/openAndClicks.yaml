                            clickToOpenRate:
                              type: number
                              format: float
                              description: >-
                                Click-to-open rate of the aggregated period
                                (retains 4 decimal places)
                              example: 0.2618
                      totalSend:
                        type: integer
                        description: Total send volume across the entire query time range
                        example: 10000
                      totalOpen:
                        type: integer
                        description: >-
                          Total unique open volume across the entire query time
                          range
                        example: 3250
                      totalClick:
                        type: integer
                        description: >-
                          Total unique click volume across the entire query time
