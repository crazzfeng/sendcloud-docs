openapi: 3.0.0
info:
  title: Email
  version: 1.0.0
servers:
  - url: https://api.aurorasendcloud.com
    description: Production server
  - url: https://api.sendcloud.net
    description: Alternative production server
tags:
  - name: Opens And Clicks
    description: Email open and click statistics management APIs
paths:
  /api/openandclick/list:
    get:
      summary: Query Opens And Clicks Records
      description: >
        Search email open and click records with optional filtering conditions
        (time range, email address, track type, etc.).

        Tips:

        1. With designated time span: startDate and endDate, or days is
        required; time span cannot be longer than 3 months.

        2. With given email address: time span will turn to invalid.

        3. If apiUserList is not specified, all records will be queried by
        default.
      tags:
        - Opens And Clicks
      security:
        - apiUser: []
          apiKey: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: >-
            Stats in the past [days] days (days=1 equals to today); required if
            startDate and endDate are not provided
          example: 1
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
            example: '2025-01-01'
          description: 'Start date (format: yyyy-MM-dd); required if days is not provided'
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
            example: '2025-01-31'
          description: 'End date (format: yyyy-MM-dd); required if days is not provided'
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
          description: Email address to query; time range becomes invalid if provided
        - name: trackType
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 1
              - 2
            example: 1
          description: >-
            1 means opens, 2 means clicks; no parameter included means to search
            both
        - name: apiUserList
          in: query
          required: false
          schema:
            type: string
            example: a;b;c
          description: >-
            Obtain stats of specified API_USER; multiple API_USERs are separated
            by semicolons
        - name: labelId
          in: query
          required: false
          schema:
            type: string
            example: '1111'
          description: Obtain stats of labelled addresses
        - name: labelName
          in: query
          required: false
          schema:
            type: string
            example: test label
          description: Obtain stats of labelName
        - name: start
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: 'Start position, defaults to 0 (range: ≥0)'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 100
          description: 'Amount, defaults to 100 (range: 0-100)'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  result:
                    type: boolean
                    example: true
                  info:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Total number of matching records
                      count:
                        type: integer
                        description: Number of records returned currently
                      dataList:
                        type: array
                        items:
                          type: object
                          properties:
                            email:
                              type: string
                              format: email
                              description: Email address
                            trackType:
                              type: integer
                              enum:
                                - 1
                                - 2
                              description: 1 means opens, 2 means clicks
                            url:
                              type: string
                              description: Clicked url (empty for open records)
                            apiUser:
                              type: string
                              description: apiUser name
                            currTime:
                              type: string
                              format: date-time
                              description: >-
                                Time of opens or clicks (format: yyyy-MM-dd
                                HH:mm:ss)
                            ip:
                              type: string
                              description: IP of opens or clicks
                            country:
                              type: string
                              description: IP of country
                            province:
                              type: string
                              description: IP of province
                            city:
                              type: string
                              description: IP of city
                            browser:
                              type: string
                              description: Browser of open or click
                            device:
                              type: string
                              description: Device of open or click
                            emailId:
                              type: string
                              description: Unique email ID (included in returned example)
                            requestTime:
                              type: string
                              format: date-time
                              description: >-
                                Email sending request time (included in returned
                                example)
components:
  securitySchemes:
    apiUser:
      type: apiKey
      in: query
      name: apiUser
      description: API user name for authentication
    apiKey:
      type: apiKey
      in: query
      name: apiKey
      description: API key for authentication
  schemas:
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: 'Invalid parameter: days or startDate&endDate is required'
        result:
          type: boolean
          example: false
